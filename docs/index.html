<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Preview of the Alumni Career Network: a directory of high school graduates by career field, with internships.">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Alumni Career Network</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: school-directory header band → field "department" tabs → filter row → card grid; profile + form in a sheet */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#152038; --muted:#5b6478; --line:#dfe3ea;
  --accent:#1d3a8a; --accent-ink:#ffffff; --gold:#c98a00; --gold-soft:#fff3d6;
  --ok:#1f7a4d; --ok-soft:#e3f4ea; --danger:#b42318;
  --band:#152038; --band-ink:#f5f6f8; --band-muted:#aab3c8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1424; --surface:#161e33; --ink:#e8ecf5; --muted:#9aa4bc; --line:#29344f;
  --accent:#8fb0ff; --accent-ink:#0e1424; --gold:#f2b739; --gold-soft:#3a2f12;
  --ok:#5fd39a; --ok-soft:#173527; --danger:#ff8a80;
  --band:#0a0f1c; --band-ink:#e8ecf5; --band-muted:#8d97b0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1424; --surface:#161e33; --ink:#e8ecf5; --muted:#9aa4bc; --line:#29344f;
  --accent:#8fb0ff; --accent-ink:#0e1424; --gold:#f2b739; --gold-soft:#3a2f12;
  --ok:#5fd39a; --ok-soft:#173527; --danger:#ff8a80;
  --band:#0a0f1c; --band-ink:#e8ecf5; --band-muted:#8d97b0; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}

/* header band */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:28px 22px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.band h1{font-size:clamp(28px,4.4vw,44px);font-weight:800;line-height:1.05;margin-top:6px}
.band p{color:var(--band-muted);margin:8px 0 0;max-width:60ch}
.school-edit{background:none;border:0;color:var(--band-muted);text-decoration:underline;cursor:pointer;padding:0;font-size:13px;margin-left:6px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:12px;color:var(--band-muted);text-transform:uppercase;letter-spacing:.08em}

/* field tabs */
.fields{border-bottom:1px solid var(--line);background:var(--surface)}
.fields .wrap{display:flex;gap:6px;overflow-x:auto;padding-block:12px;scrollbar-width:thin}
.ftab{flex:0 0 auto;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13.5px;font-weight:500;display:flex;gap:6px;align-items:center;white-space:nowrap}
.ftab .n{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.ftab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ftab[aria-pressed="true"] .n{color:inherit;opacity:.75}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:18px}
.search{flex:1 1 260px;min-width:0;position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
select{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);max-width:100%}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;gap:6px;align-items:center}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.result-line{font-size:13px;color:var(--muted);margin:-4px 0 14px}
.notice{background:var(--gold-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:14px;margin-bottom:14px}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;padding-bottom:48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;min-width:0;transition:border-color .15s, transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card-top{display:flex;gap:12px;align-items:flex-start}
.avatar{flex:0 0 44px;height:44px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:16px}
.card h3{font-size:18px;font-weight:600;line-height:1.2}
.role{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.year{font-family:var(--f-mono);font-size:12px;color:var(--gold);white-space:nowrap}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:3px 9px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.chip.field{border-color:transparent;background:var(--ink);color:var(--bg)}
.chip.sample{background:var(--gold-soft);color:var(--gold);border-color:transparent;font-weight:600}
.chip.open{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.level{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card .loc{font-size:13px;color:var(--muted)}

.empty{grid-column:1/-1;border:1.5px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:22px;margin-bottom:6px}
.empty p{max-width:52ch;margin:0 auto 16px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,28,.55);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) 20px;display:flex;flex-direction:column;gap:18px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.x{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer;flex:0 0 auto;font-size:18px;line-height:1}
.sheet h2{font-size:26px;font-weight:800}
.section-label{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.contact-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.contact-row div{min-width:0}
.contact-row .val{font-weight:500;overflow-wrap:anywhere;user-select:all}
.contact-row .k{font-size:12px;color:var(--muted)}
.contact-row a{color:var(--accent)}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:13px;flex:0 0 auto}
.stack{display:flex;flex-direction:column;gap:8px}
.advice{background:var(--bg);border-radius:10px;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere}
.tip{font-size:13px;color:var(--muted);border-left:3px solid var(--gold);padding-left:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.row2{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{font-weight:400;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);width:100%}
label.f small{font-weight:400;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
legend{font-size:13px;font-weight:600;padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--gold-soft);padding:10px 12px;border-radius:10px}
.err{color:var(--danger);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:reduce){.card{transition:none}.card:hover{transform:none}}

/* account + views */
a.btn{text-decoration:none}
.btn.small{padding:7px 12px;font-size:13.5px}
.btn.onband{background:var(--gold);color:var(--band)}
.acct{display:flex;align-items:center;gap:12px;font-size:14px;margin-left:auto}
.acct-note{color:var(--band-muted);font-size:13px}
.acct-id{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.acct .who{color:var(--band-ink);font-weight:600}
.acct .role-tag{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--gold)}
.views{background:var(--surface);border-bottom:1px solid var(--line)}
.views .wrap{display:flex;gap:4px}
.vtab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font-weight:600;cursor:pointer;color:var(--muted);display:flex;gap:8px;align-items:center}
.vtab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--gold)}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:11.5px;padding:1px 7px;font-variant-numeric:tabular-nums}
.chip.joined{background:transparent;border-color:var(--accent);color:var(--accent)}

/* messages */
.msg-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding-top:18px}
.privacy{font-size:12.5px;color:var(--muted);margin:0;max-width:72ch}
.staff-toggle{font-size:13.5px;display:flex;gap:6px;align-items:center}
.msgs{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);border:1px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;margin-block:14px 48px;min-height:520px}
.tlist{border-right:1px solid var(--line);overflow-y:auto;max-height:70vh;min-width:0}
.titem{display:flex;gap:10px;padding:12px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;align-items:flex-start}
.titem:hover,.titem[aria-current="true"]{background:var(--bg)}
.titem .t{min-width:0;flex:1}
.tname{font-weight:600;display:block;overflow-wrap:anywhere}
.titem .snip{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .when{font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 8px;margin-top:7px}
.dot.off{background:transparent}
.convo{display:flex;flex-direction:column;min-width:0;max-height:70vh}
.chead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:260px}
.bubble{max-width:78%;padding:9px 12px;border-radius:14px;background:var(--bg);white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}
.bubble.mine{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.bubble .from{display:block;font-size:12px;font-weight:600;opacity:.8;margin-bottom:2px}
.bubble .ts{display:block;font-size:11px;opacity:.75;margin-top:3px}
.sysnote{align-self:center;text-align:center;font-size:13px;color:var(--muted);max-width:52ch;margin:auto}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:vertical;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.convo .privacy{padding:12px 16px;border-top:1px solid var(--line)}
.back{display:none}
@media (max-width:760px){
  .msgs{grid-template-columns:minmax(0,1fr)}
  .msgs.open .tlist{display:none}
  .msgs:not(.open) .convo{display:none}
  .tlist{border-right:0}
  .back{display:inline-flex}
}

/* internships + paging */
.small{font-size:13px}
.muted{color:var(--muted)}
.linklike{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer;font:inherit}
.checks-inline{display:flex;gap:6px;align-items:center;font-size:14px}
.newsbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px}
.newsbox-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.newsbox-head h2{font-size:22px;margin-top:4px}
.intern-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.intern{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.newsbox .intern{background:var(--bg)}
.intern.closed{border-left-color:var(--line);opacity:.75}
.intern-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.intern-company{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.intern h3{font-size:19px;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.intern-desc{margin:0;overflow-wrap:anywhere}
.chip.paid{background:var(--gold-soft);color:var(--gold);border-color:transparent;font-weight:600}
.facts{display:flex;flex-wrap:wrap;gap:6px 20px;margin:0}
.facts dt{font-size:11px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-weight:500;font-variant-numeric:tabular-nums}
.reqs p{margin:2px 0;font-size:14px;overflow-wrap:anywhere}
.intern-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:-28px 0 48px}
.pager:empty{display:none}
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div>
      <div class="eyebrow">Alumni career network</div>
      <h1 id="schoolName">Our High School</h1>
      <p>Find graduates working in the field you care about, then reach out for advice, a job shadow, or an informational interview. <button class="school-edit" id="editSchool" hidden>Rename school</button></p>
    </div>
    <div class="stats" aria-live="polite">
      <div class="stat"><b id="sAlumni">0</b><span>Alumni</span></div>
      <div class="stat"><b id="sFields">0</b><span>Fields</span></div>
      <div class="stat"><b id="sMentors">0</b><span>Open to mentoring</span></div>
    </div>
    <div class="acct" id="acct"></div>
  </div>
</header>

<nav class="views" aria-label="Sections"><div class="wrap">
  <button class="vtab" type="button" data-view="directory" aria-current="page">Directory</button>
  <button class="vtab" type="button" data-view="internships" aria-current="false">Internships</button>
  <button class="vtab" type="button" data-view="messages" aria-current="false">Messages <span class="badge" id="unread" hidden></span></button>
</div></nav>

<nav class="fields" id="fieldsNav" aria-label="Filter by field"><div class="wrap" id="fieldTabs"></div></nav>

<main class="wrap" id="viewDir">
  <section class="newsbox" aria-labelledby="news-h">
    <div class="newsbox-head">
      <div><div class="eyebrow">News</div><h2 id="news-h">Open internships</h2></div>
      <div class="actions"><button class="btn ghost small" type="button" id="newsPost" data-act="postint" hidden>+ Post one</button><button class="btn small" type="button" id="newsAll" data-view="internships">See all</button></div>
    </div>
    <div id="newsList"><p class="muted" style="margin:0">Loading internships…</p></div>
  </section>
  <div class="toolbar">
    <label class="search"><span hidden>Search</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search name, job title, employer, college, city…" aria-label="Search alumni">
    </label>
    <select id="openFilter" aria-label="Open to">
      <option value="">Open to anything</option>
    </select>
    <select id="decadeFilter" aria-label="Graduation decade"><option value="">Any class year</option></select>
    <select id="sort" aria-label="Sort">
      <option value="recent">Newest grads first</option>
      <option value="oldest">Oldest grads first</option>
      <option value="name">Name A–Z</option>
      <option value="title">Job title A–Z</option>
      <option value="senior">Most senior first</option>
      <option value="junior">Early career first</option>
    </select>
    <button class="btn" id="addBtn" type="button">+ Add alumnus</button>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div class="result-line" id="resultLine"></div>
  <section class="grid" id="grid" aria-live="polite"></section>
  <nav class="pager" id="pager" aria-label="Pages"></nav>
</main>
<main class="wrap" id="viewInt" hidden><div id="intRoot"></div><div style="height:48px"></div></main>
<main class="wrap" id="viewMsg" hidden><div id="msgRoot"></div></main>

<div class="scrim" id="scrim" hidden><aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside></div>
<div class="toast" id="toast" hidden></div>

<script>
const FIELDS=["Healthcare & Medicine","Engineering","Business","Finance","Law","Journalism","Media & Communications","Architecture","Performing Arts","Hospitality","Politics & Government","Technology & Computing","Education","Science & Research","Arts & Design","Military","Skilled Trades","Nonprofit & Social Impact","Sports & Recreation","Other"];
const OPEN=["Mentoring","Informational interviews","Job shadowing","Internships","Résumé review","College advice"];
const state={alumni:[],field:"",q:"",open:"",decade:"",sort:"recent",canWrite:null,canAdmin:false,db:null,uid:null,loaded:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const yr=y=>y?`Class of '${String(y).slice(-2)}`:"";

OPEN.forEach(o=>$("openFilter").insertAdjacentHTML("beforeend",`<option>${esc(o)}</option>`));

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function notice(msg){const n=$("notice");n.textContent=msg||"";n.hidden=!msg}

/* Seniority from job title keywords, highest match wins. Works for profiles people add later too. */
const LEVELS=["","Student","Early career","Professional","Senior specialist","Manager","Executive / owner"];
const RANKS=[
  [1,/\b(student|trainee|apprentice)\b/i],
  [6,/\b(chief|ceo|cfo|cto|coo|president|vice president|vp|owner|founder|partner|executive director|artistic director|publisher|mayor|senator|state representative|judge)\b/i],
  [5,/\b(manager|director|administrator|head of|supervisor|principal|managing editor|executive chef|executive producer)\b/i],
  [4,/\b(senior|sr\.?|lead|physician|surgeon|cardiologist|dentist|cpa|actuary|professional engineer|attorney|architect|counsel|correspondent|anchor|producer)\b/i],
  [2,/\b(resident|intern|associate|junior|jr\.?|assistant|co-op|investment banking analyst|staff accountant|paralegal|aide|fellow|clerk)\b/i]];
function seniority(t){t=t||"";if(/physician assistant/i.test(t))return 4;for(const [n,re] of RANKS)if(re.test(t))return n;return t?3:0}
/* Precompute search text and seniority once per profile, so filtering 5,000 stays instant. */
function prep(a){a._hay=[a.name,a.title,a.organization,a.college,a.city,a.field,a.specialty].join(" ").toLowerCase();a._sen=seniority(a.title);return a}

function filtered(){
  const q=state.q.toLowerCase().trim();
  let list=state.alumni.filter(a=>{
    if(state.field&&a.field!==state.field)return false;
    if(state.open&&!(a.openTo||[]).includes(state.open))return false;
    if(state.decade&&String(Math.floor((+a.classYear||0)/10)*10)!==state.decade)return false;
    if(q&&!q.split(/\s+/).every(w=>a._hay.includes(w)))return false;
    return true});
  const s=state.sort;
  const byYear=(a,b)=>(a.classYear||0)-(b.classYear||0);
  list.sort((a,b)=>s==="name"?(a.name||"").localeCompare(b.name||"")
    :s==="title"?(a.title||"~").localeCompare(b.title||"~")||(a.name||"").localeCompare(b.name||"")
    :s==="senior"?b._sen-a._sen||byYear(a,b)
    :s==="junior"?a._sen-b._sen||byYear(b,a)
    :s==="oldest"?byYear(a,b):byYear(b,a));
  return list;
}

async function save(id){
  const v=k=>$(k).value.trim();
  const rec={name:v("f_name"),classYear:parseInt(v("f_year"))||null,field:v("f_field"),specialty:v("f_spec"),title:v("f_title"),organization:v("f_org"),city:v("f_city"),college:v("f_college"),
    openTo:OPEN.filter((o,i)=>$("f_open"+i).checked),email:v("f_email"),phone:v("f_phone"),linkedin:v("f_li"),preferred:v("f_pref"),bio:v("f_bio"),consent:$("f_consent").checked,updatedAt:new Date().toISOString()};
  const err=$("ferr");
  if(!rec.name||!rec.classYear||!rec.field){err.textContent="Add a name, graduation year, and field before saving.";return}
  if((rec.email||rec.phone||rec.linkedin)&&!rec.consent){err.textContent="Tick the consent box to confirm this graduate agreed to share their contact details, or remove the contact details.";return}
  if(!state.db){err.textContent="Saving isn't available in this view. This preview can't save changes.";return}
  $("fsave").disabled=true;err.textContent="";
  try{
    if(id){const old=state.alumni.find(x=>x.id===id)||{};await state.db.doc("alumni/"+id).set({...stripId(old),...rec})}
    else await state.db.collection("alumni").doc().set({...rec,createdAt:rec.updatedAt,addedBy:state.uid||null});
    closeSheet();toast(id?"Profile saved":`${rec.name} added to the directory`);
  }catch(e){
    $("fsave").disabled=false;
    if(e?.code==="invalid_argument"){state.canWrite=false;err.textContent="Your access level can view the directory but not change it. Ask the directory owner for Contributor access.";render()}
    else if(e?.code==="quota_exceeded")err.textContent="The directory is full. Remove outdated profiles to make room.";
    else err.textContent="Couldn't save right now. Check your connection and try again.";
  }
}
const stripId=o=>{const {id,...r}=o;return r};

async function del(id){
  try{await state.db.doc("alumni/"+id).delete();closeSheet();toast("Profile removed")}
  catch(e){$("delZone").innerHTML=`<p class="err">Couldn't remove this profile. ${e?.code==="invalid_argument"?"Your access level can't change the directory.":"Try again."}</p>`}
}

document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-field],[data-id],[data-act],[data-copy]");if(!t)return;
  if(t.dataset.copy!==undefined){const val=t.dataset.copy;try{await navigator.clipboard.writeText(val);t.textContent="Copied"}catch{const r=document.createRange();r.selectNodeContents(t.previousElementSibling.querySelector(".val"));const s=getSelection();s.removeAllRanges();s.addRange(r);t.textContent="Selected"}setTimeout(()=>t.textContent="Copy",1500);return}
  const act=t.dataset.act;
  if(t.classList.contains("ftab")){state.field=t.dataset.field;state.page=1;render();return}
  if(t.classList.contains("card")){showProfile(t.dataset.id);return}
  if(act==="close")closeSheet();
  else if(act==="add")showForm();
  else if(act==="clear"){state.field="";state.q="";state.open="";state.decade="";state.page=1;$("q").value="";$("openFilter").value="";render()}
  else if(act==="edit")showForm(state.alumni.find(x=>x.id===t.dataset.id));
  else if(act==="askdel"){$("delZone").innerHTML=`<div class="notice">Remove this profile for everyone? <div class="actions" style="margin-top:8px"><button class="btn danger" type="button" data-act="del" data-id="${esc(t.dataset.id)}">Yes, remove</button><button class="btn ghost" type="button" data-act="nodel">Keep it</button></div></div>`}
  else if(act==="nodel")$("delZone").innerHTML="";
  else if(act==="del")del(t.dataset.id);
});

async function ensureNames(ids){
  const need=[...new Set(ids)].filter(id=>id&&!(id in state.names));
  if(!need.length||!state.user)return;
  need.forEach(id=>state.names[id]="");
  try{const ps=await state.user.profiles(need);need.forEach(id=>state.names[id]=ps?.[id]?.name||"")}catch{}
  if(state.view==="messages")renderMsgs();
}
function personName(uid){
  if(uid===state.uid)return state.myName||"You";
  const m=state.members[uid];
  if(m?.alumniId){const a=state.alumni.find(x=>x.id===m.alumniId);if(a)return a.name}
  return state.names[uid]||"A network member";
}
function otherParty(t){
  const alum=state.alumni.find(x=>x.id===t.alumniId);
  const alumSide={name:alum?.name||"Removed profile",sub:alum?[alum.title,alum.organization].filter(Boolean).join(" · "):""};
  const m=state.members[t.starterId];
  const starterSide={name:personName(t.starterId),sub:m?[ROLE_LABEL[m.role],m.gradYear?yr(m.gradYear):""].filter(Boolean).join(" · "):""};

      if(m.alumniId&&m.alumniId!==alumniId){const old=state.alumni.find(x=>x.id===m.alumniId);if(old?.claimedBy===state.uid)await state.db.doc("alumni/"+m.alumniId).update({claimedBy:null})}
      const now=new Date().toISOString();

function subscribeThreads(){
  if(!state.member||!state.db)return;
  const db=state.db;
  const put=(kind,s)=>{state[kind]=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));state.threads={...state.mineT,...state.alumT};updateBadge();if(state.view==="messages")renderMsgs()};
  if(!state.mineSub)state.mineSub=db.collection("threads").where("starterId","==",state.uid).limit(500).onSnapshot(s=>put("mineT",s),()=>{});
  const aid=state.member.alumniId||null;
  if(aid!==state.subscribedAlum){
    state.unsubAlumThreads?.();state.subscribedAlum=aid;state.alumT={};state.threads={...state.mineT};
    state.unsubAlumThreads=aid?db.collection("threads").where("alumniId","==",aid).limit(500).onSnapshot(s=>put("alumT",s),()=>{}):null;
  }
}
function subscribeAll(){
  if(state.unsubAll)return;
  state.unsubAll=state.db.collection("threads").orderBy("lastAt","desc").limit(300).onSnapshot(s=>{state.allThreads=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));if(state.view==="messages")renderMsgs()},()=>{});
}

let readBusy=false;
async function markRead(tid){
  const at=threadById(tid)?.lastAt;
  if(!at||state.reads[tid]>=at||readBusy||!state.db)return;
  state.reads={...state.reads,[tid]:at};updateBadge();
  readBusy=true;try{await state.db.doc(`data/users/${state.uid}/reads`).set(state.reads)}catch{}readBusy=false;
}

function openThread(tid,meta){
  if(state.active?.id!==tid){
    state.unsubMsgs?.();state.msgs=[];state.draft="";
    state.active={id:tid,...(threadById(tid)||meta||{})};
    state.unsubMsgs=state.db.collection(`threads/${tid}/messages`).orderBy("at").limit(500).onSnapshot(s=>{state.msgs=s.docs.map(d=>({id:d.id,...d.data()}));if(state.view==="messages")renderMsgs(true)},()=>{state.msgs=[];renderMsgs()});
  }
  markRead(tid);renderMsgs(true);
}
function startMessage(alumId){
  if(!state.uid){closeSheet();toast("Messaging is turned off in this preview.");return}
  if(!state.member){showJoin();return}
  if(state.member.alumniId===alumId){toast("That's your own profile.");return}
  closeSheet();state.staffMode=false;setView("messages");
  openThread(tidFor(state.uid,alumId),{starterId:state.uid,alumniId:alumId});

}
async function sendMsg(text,via){
  const a=state.active;text=(text||"").trim();if(!a||!text)return false;
  const now=new Date().toISOString();const t=threadById(a.id);
  try{
    await state.db.collection(`threads/${a.id}/messages`).doc().set({from:state.uid,text,at:now,via});
    await state.db.doc("threads/"+a.id).set({starterId:a.starterId,alumniId:a.alumniId,createdAt:t?.createdAt||now,lastAt:now,lastFrom:state.uid,lastText:text.slice(0,140),lastVia:via});
    state.reads={...state.reads,[a.id]:now};
    state.db.doc(`data/users/${state.uid}/reads`).set(state.reads).catch(()=>{});
    return true;
  }catch(e){toast(e?.code==="invalid_argument"?"Your access level can't send messages. Ask the directory owner for Contributor access.":"Message not sent. Check your connection and try again.");return false}
}

      ||`<p class="sysnote">${alum&&!alum.claimedBy?`${esc(alum.name)} hasn't joined the network yet. Your message will wait here until they link their profile. You can also email them.`:"No messages yet. Introduce yourself and ask one specific question."}</p>`;

      <div class="cbody" id="cbody">${bubbles}</div>

  }
  root.innerHTML=`<div class="msg-top"><p class="privacy">Messages are kept in this directory's shared storage. This page shows each conversation only to the two people in it and to staff reviewers. Anyone with edit access to the directory can read all messages, so don't share passwords or private personal details.</p>${state.canAdmin?`<label class="staff-toggle"><input type="checkbox" id="m_staff" ${state.staffMode?"checked":""}> Review all conversations (staff)</label>`:""}</div>

function showEmail(alumId){
  const a=state.alumni.find(x=>x.id===alumId);if(!a)return;
  const first=(a.name||"").split(" ")[0];

      <label class="f">Application deadline<input id="i_deadline" type="date" value="${esc(i.deadline)}"></label></div>
    <div class="row2"><label class="f">Location <small>City, or Remote</small><input id="i_loc" maxlength="120" value="${esc(i.location)}"></label>
      <label class="f">Field<select id="i_field"><option value="">Choose a field</option>${FIELDS.map(x=>`<option ${i.field===x?"selected":""}>${esc(x)}</option>`).join("")}</select></label></div>
    <fieldset><legend>Who can apply</legend><div class="checks">${GRADE_LEVELS.map((g,k)=>`<label><input type="checkbox" id="i_g${k}" ${(i.gradeLevels||[]).includes(g)?"checked":""}> ${esc(g)}</label>`).join("")}</div></fieldset>
    <div class="row2"><label class="f">Minimum GPA <small>Optional</small><input id="i_gpa" type="number" step="0.1" min="0" max="5" value="${esc(i.minGpa??"")}"></label><div></div></div>
    <label class="f">Experience or skills required <small>Optional, e.g. "Took AP Biology"</small><textarea id="i_exp" rows="2" maxlength="600">${esc(i.experience)}</textarea></label>
    ${item?`<label class="checks-inline"><input type="checkbox" id="i_open" ${i.isOpen?"checked":""}> Still accepting applications</label>`:""}
    <div class="err" id="ierr" role="alert"></div>
    <div class="actions"><button class="btn" type="submit" id="isave">${item?"Save changes":"Post internship"}</button>${item?`<button class="btn danger" type="button" id="idel">Delete posting</button>`:""}</div>
    <div id="idelZone"></div>
  </form>`);
  const syncPay=()=>{$("i_payL").hidden=!$("i_paid_yes").checked};
  document.querySelectorAll('input[name="i_paid"]').forEach(r=>r.addEventListener("change",syncPay));syncPay();
  const owner=item?.owner||state.uid;
  const fail=err=>{$("isave").disabled=false;$("ierr").textContent=err?.code==="invalid_argument"?"Your access level can't post here. Ask the directory owner for Contributor access.":"Couldn't save. Check your connection and try again."};
  $("iform").addEventListener("submit",async e=>{e.preventDefault();
    const v=id=>$(id).value.trim();const paid=document.querySelector('input[name="i_paid"]:checked')?.value;
    const rec={company:v("i_company"),roleTitle:v("i_title"),description:v("i_desc"),signupUrl:v("i_url"),spots:parseInt(v("i_spots"))||null,
      gradeLevels:GRADE_LEVELS.filter((g,k)=>$("i_g"+k).checked),minGpa:v("i_gpa")===""?null:Number(v("i_gpa")),experience:v("i_exp"),
      paid:paid==="yes",payDetails:paid==="yes"?v("i_pay"):"",location:v("i_loc"),field:v("i_field"),deadline:v("i_deadline"),isOpen:item?$("i_open").checked:true};
    const err=$("ierr");
    if(!rec.company||!rec.roleTitle||!rec.description){err.textContent="Add the company, the internship title and a short description.";return}
    if(!/^https?:\/\/\S+$/i.test(rec.signupUrl)){err.textContent="Add the sign-up link, starting with https://";return}
    if(!paid){err.textContent="Say whether the internship is paid or unpaid.";return}
    if(rec.spots!==null&&(rec.spots<1||rec.spots>1000)){err.textContent="Spots must be between 1 and 1,000.";return}
    if(rec.minGpa!==null&&(isNaN(rec.minGpa)||rec.minGpa<0||rec.minGpa>5)){err.textContent="Minimum GPA must be between 0 and 5.";return}
    $("isave").disabled=true;err.textContent="";const now=new Date().toISOString();
    try{
      await writePosts(owner,posts=>item?posts.map(p=>p.id===item.id?{...p,...rec,updatedAt:now}:p)
        :[{id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...rec,createdAt:now,updatedAt:now},...posts]);
      closeSheet();toast(item?"Internship updated":"Internship posted");
    }catch(x){fail(x)}
  });
  $("idel")?.addEventListener("click",()=>{
    $("idelZone").innerHTML=`<div class="notice">Delete this posting for everyone? <div class="actions" style="margin-top:8px"><button class="btn danger small" type="button" id="idelYes">Yes, delete</button><button class="btn ghost small" type="button" id="idelNo">Keep it</button></div></div>`;
    $("idelNo").onclick=()=>$("idelZone").innerHTML="";
    $("idelYes").onclick=async()=>{try{await writePosts(owner,posts=>posts.filter(p=>p.id!==item.id));closeSheet();toast("Posting deleted")}catch(x){fail(x)}};
  });
}

/* ---------- data ---------- */
function mergeAlumni(){state.alumni=[...state.real,...state.samples];render();renderAllInt();if(state.view==="messages")renderMsgs()}
fetch("sample-alumni.json").then(r=>r.ok?r.json():[]).then(list=>{state.samples=list.map(a=>prep({...a,sample:true,static:true,consent:true}));state.loaded=true;mergeAlumni()}).catch(()=>{});
fetch("sample-internships.json").then(r=>r.ok?r.json():[]).then(list=>{state.intSamples=list;renderAllInt()}).catch(()=>{});
state.school="Our High School";
setView(VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"directory");
render();renderNews();
(async()=>{
  const timer=setTimeout(()=>{if(!state.loaded){state.loaded=true;notice("The directory can't be reached yet. It will fill in once the connection returns.");render()}},10000);
  const use=n=>window.claude?.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  const [db,user]=await Promise.all([use("db"),use("user")]);
  state.user=user;
  if(user){
    state.canAdmin=await user.canEdit().catch(()=>false);
    const w=await user.can("data.write").catch(()=>null);state.canWrite=w;
    state.uid=await user.id().catch(()=>null);
    try{state.myName=(await user.me())?.name||""}catch{}
  }
  if(!db){clearTimeout(timer);state.loaded=true;state.ready=true;state.uid=null;state.canWrite=false;notice("Preview version: you can browse the directory and internships. Signing in, messaging and posting work once the full site is hosted.");render();renderAcct();renderAllInt();if(state.view==="messages")renderMsgs();return}
  state.db=db;state.ready=true;
  if(state.uid){
    db.doc("members/"+state.uid).onSnapshot(s=>{state.member=s.exists?s.data():null;renderAcct();subscribeThreads();renderAllInt();if(state.view==="messages")renderMsgs()},()=>{});
    db.collection("members").limit(1000).onSnapshot(s=>{state.members=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));renderAllInt();if(state.view==="messages")renderMsgs()},()=>{});
    db.doc(`data/users/${state.uid}/reads`).onSnapshot(s=>{if(s.exists){const r={...state.reads};for(const [k,v] of Object.entries(s.data()||{}))if(!(r[k]>=v))r[k]=v;state.reads=r}updateBadge()},()=>{});
  }
  renderAcct();if(state.view==="messages")renderMsgs();
  db.doc("config/school").onSnapshot(s=>{const n=s.exists&&s.data()?.name;if(n){state.school=n;$("schoolName").textContent=n;document.title=n+" Alumni Network"}},()=>{});
  db.collection("internships").onSnapshot(s=>{state.intDocs=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));renderAllInt()},()=>{});
  db.collection("alumni").onSnapshot(snap=>{
    state.real=snap.docs.map(d=>prep({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache){clearTimeout(timer);notice("")}
    state.loaded=true;mergeAlumni();
  },err=>{clearTimeout(timer);state.loaded=true;notice("The directory couldn't load. Reload the page to try again.");render()});
})();
</script>
