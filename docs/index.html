<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Preview of the Alumni Career Network: a directory of high school graduates by career field, with internships.">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Alumni Career Network</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* A plain school directory: school-colour header bar, filter sidebar, ruled result list. */
:root{
  --bg:#ffffff; --panel:#f4f5f6; --ink:#1c1f24; --muted:#5d636b; --line:#d8dbdf; --line-strong:#b9bec4;
  --accent:#7b1c24; --accent-hover:#5f141b; --accent-ink:#ffffff; --link:#1b4f9c;
  --ok:#2e6b34; --danger:#a1261d; --tag:#eceef0;
  --band:#7b1c24; --band-ink:#ffffff; --band-muted:#f1d9db;
  --gold:var(--accent); --gold-soft:var(--panel);
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", Helvetica, Arial, sans-serif;
  --f-mono:var(--f-body);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171a; --panel:#1d2024; --ink:#e7e9ec; --muted:#a2a8b0; --line:#30343a; --line-strong:#454a52;
  --accent:#d9737c; --accent-hover:#e8959c; --accent-ink:#15171a; --link:#8db4f0;
  --ok:#7cc48a; --danger:#f08a80; --tag:#262a2f;
  --band:#4a1015; --band-ink:#ffffff; --band-muted:#e3c2c5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171a; --panel:#1d2024; --ink:#e7e9ec; --muted:#a2a8b0; --line:#30343a; --line-strong:#454a52;
  --accent:#d9737c; --accent-hover:#e8959c; --accent-ink:#15171a; --link:#8db4f0;
  --ok:#7cc48a; --danger:#f08a80; --tag:#262a2f;
  --band:#4a1015; --band-ink:#ffffff; --band-muted:#e3c2c5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
a{color:var(--link)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;line-height:1.2}
.small{font-size:14px}
.muted{color:var(--muted)}

/* header */
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:18px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.band h1{font-size:26px}
.tagline{margin:2px 0 0;color:var(--band-muted);font-size:15px}
.school-edit{background:none;border:0;color:var(--band-muted);text-decoration:underline;cursor:pointer;padding:0;font-size:14px;margin-left:8px}
.acct{display:flex;align-items:center;gap:12px;font-size:14px}
.acct-note{color:var(--band-muted)}
.acct-id{display:flex;flex-direction:column;align-items:flex-end;line-height:1.3}
.acct .who{color:var(--band-ink);font-weight:600}
.acct .role-tag{color:var(--band-muted);font-size:13px}
.acct .school-edit{margin:0}
.views{border-bottom:1px solid var(--line);background:var(--bg)}
.views .wrap{display:flex;gap:0;overflow-x:auto}
.vtab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 16px 10px;font-weight:600;cursor:pointer;color:var(--muted);white-space:nowrap}
.vtab:hover{color:var(--ink)}
.vtab[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.badge{color:var(--accent);font-weight:700;margin-left:4px}
.badge::before{content:"("}.badge::after{content:")"}

/* buttons and controls */
.btn{border:1px solid var(--accent);border-radius:4px;padding:8px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;gap:6px;align-items:center;text-decoration:none;line-height:1.3}
.btn:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--panel)}
.btn.danger{background:var(--bg);color:var(--danger);border-color:var(--line-strong)}
.btn.small{padding:5px 10px;font-size:14px}
.btn.onband{background:var(--bg);color:var(--accent);border-color:var(--bg)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linklike,.linkbtn{background:none;border:0;padding:0;color:var(--link);text-decoration:underline;cursor:pointer;font:inherit}
select,input[type="search"]{padding:7px 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--bg);max-width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:8px}
.notice{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:10px 14px;font-size:15px;margin:0 0 14px}

/* directory layout */
.intro{margin:20px 0 18px;max-width:70ch;color:var(--muted)}
.counts{display:block;color:var(--ink);margin-top:2px}
.dir-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:32px;align-items:start;padding-bottom:40px}
.side{border-top:3px solid var(--accent);padding-top:12px;display:flex;flex-direction:column;gap:18px}
.side-h{font-family:var(--f-body);font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.field-list{display:flex;flex-direction:column}
.ftab{display:flex;justify-content:space-between;gap:8px;background:none;border:0;border-bottom:1px solid var(--line);padding:7px 2px;text-align:left;cursor:pointer;color:var(--link);font-size:15px}
.ftab:hover{text-decoration:underline}
.ftab .n{color:var(--muted);font-variant-numeric:tabular-nums}
.ftab[aria-pressed="true"]{color:var(--ink);font-weight:700}
.side-f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.side-f select{text-transform:none;letter-spacing:0;font-weight:400;color:var(--ink);font-size:15px}
.dir-main{min-width:0}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.search{flex:1 1 260px;min-width:0}
.search input{width:100%}
.result-line{font-size:14px;color:var(--muted);margin:0 0 8px}

/* result list */
.list-head,.card{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.7fr) minmax(0,1fr) 92px;gap:14px}
.list-head{font-size:13px;font-weight:700;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line-strong)}
.grid{display:block}
.card{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;cursor:pointer;align-items:start}
.card:hover{background:var(--panel)}
.card:hover .c-name{text-decoration:underline}
.c-name{color:var(--link);font-weight:600;overflow-wrap:anywhere}
.c-job,.c-field,.c-year{overflow-wrap:anywhere;font-size:15px}
.card small{display:block;color:var(--muted);font-size:13.5px;margin-top:1px}
.tag{display:inline-block;font-size:12px;font-weight:600;color:var(--muted);background:var(--tag);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:1px}
.tag.on{color:var(--ok)}
.empty{border:1px solid var(--line);border-radius:4px;padding:28px 20px;color:var(--muted);margin-top:8px}
.empty h2{color:var(--ink);font-size:20px;margin-bottom:6px}
.empty p{max-width:60ch;margin:0 0 12px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:16px 0 0}
.pager:empty{display:none}

/* internships on the directory page */
.news{border:1px solid var(--line);border-radius:4px;padding:14px 16px;margin-bottom:22px}
.news-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.news-head h2{font-size:19px}
.news-links{display:flex;gap:14px;font-size:15px}
.news-list{list-style:none;margin:0;padding:0}
.news-list li{padding:7px 0;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between}
.news-list li:first-child{border-top:0}
.news-list .when{color:var(--muted);font-size:14px}

/* internships page */
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.page-head h2{font-size:26px}
.page-head p{margin:4px 0 0;color:var(--muted)}
.checks-inline{display:flex;gap:6px;align-items:center;font-size:15px}
.intern-list{display:flex;flex-direction:column;gap:14px}
.intern{border:1px solid var(--line);border-radius:4px;padding:16px 18px;min-width:0}
.intern.closed{background:var(--panel)}
.i-top{display:flex;justify-content:space-between;gap:6px 16px;flex-wrap:wrap;align-items:baseline}
.intern h3{font-size:20px;overflow-wrap:anywhere}
.i-pay{font-weight:600;white-space:nowrap}
.i-co{margin:2px 0 10px;color:var(--muted)}
.i-desc{margin:0 0 12px;max-width:75ch;overflow-wrap:anywhere}
.i-facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;margin:0 0 12px;font-size:15px}
.i-facts dt{color:var(--muted)}
.i-facts dd{margin:0;overflow-wrap:anywhere}
.i-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px;font-size:14.5px}
.i-status{font-size:14px;color:var(--muted);margin-left:6px}

/* profile panel */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:flex-end;z-index:20}
.sheet{background:var(--bg);width:min(560px,100%);height:100%;overflow-y:auto;padding:max(22px,env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) max(28px,env(safe-area-inset-bottom,0px)) 22px;display:flex;flex-direction:column;gap:16px;border-left:1px solid var(--line)}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px}
.x{background:none;border:1px solid var(--line-strong);border-radius:4px;width:34px;height:34px;cursor:pointer;flex:0 0 auto;font-size:18px;line-height:1}
.sheet h2{font-size:26px}
.role{color:var(--muted);overflow-wrap:anywhere}
.section-label{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:4px}
.facts-list{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:4px 16px;margin:0}
.facts-list dt{color:var(--muted)}
.facts-list dd{margin:0;overflow-wrap:anywhere}
.contact-row{display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0}
.contact-row div{min-width:0}
.contact-row .val{overflow-wrap:anywhere;user-select:all}
.contact-row .k{font-size:13px;color:var(--muted)}
.copy{border:1px solid var(--line-strong);background:var(--bg);border-radius:4px;padding:3px 9px;cursor:pointer;font-size:13px;flex:0 0 auto}
.advice{white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.tip{font-size:14.5px;color:var(--muted);margin:0}

/* forms */
form{display:flex;flex-direction:column;gap:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14.5px;font-weight:600;min-width:0}
label.f input,label.f select,label.f textarea{font-weight:400;padding:7px 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--bg);width:100%}
label.f small{font-weight:400;color:var(--muted)}
fieldset{border:1px solid var(--line);border-radius:4px;padding:10px 12px;margin:0}
legend{font-size:14.5px;font-weight:600;padding:0 4px}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px}
.checks label{display:flex;gap:6px;align-items:center;font-size:15px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;border:1px solid var(--line);padding:10px 12px;border-radius:4px}
.err{color:var(--danger);font-size:14.5px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:4px;font-size:15px;z-index:30;max-width:calc(100% - 32px)}

/* messages */
.msg-top{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center;padding-top:18px}
.privacy{font-size:14px;color:var(--muted);margin:0;max-width:75ch}
.staff-toggle{font-size:14.5px;display:flex;gap:6px;align-items:center}
.msgs{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);border:1px solid var(--line);border-radius:4px;margin-block:14px 48px;min-height:520px}
.tlist{border-right:1px solid var(--line);overflow-y:auto;max-height:70vh;min-width:0}
.titem{display:flex;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer;align-items:flex-start}
.titem:hover,.titem[aria-current="true"]{background:var(--panel)}
.titem .t{min-width:0;flex:1}
.tname{font-weight:600;display:block;overflow-wrap:anywhere}
.titem .snip{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titem .when{font-size:13px;color:var(--muted);white-space:nowrap}
.new{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.03em}
.convo{display:flex;flex-direction:column;min-width:0;max-height:70vh}
.chead{padding:11px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cbody{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:260px}
.bubble{max-width:80%;padding:8px 12px;border-radius:4px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere;align-self:flex-start}
.bubble.mine{align-self:flex-end;background:var(--bg);border-color:var(--line-strong)}
.bubble .from{display:block;font-size:13px;font-weight:700;margin-bottom:2px}
.bubble .ts{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.sysnote{align-self:center;text-align:center;font-size:14.5px;color:var(--muted);max-width:52ch;margin:auto}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);align-items:flex-end}
.composer textarea{flex:1;min-width:0;resize:vertical;min-height:44px;padding:8px 10px;border:1px solid var(--line-strong);border-radius:4px;background:var(--bg)}
.convo .privacy{padding:12px 16px;border-top:1px solid var(--line)}
.back{display:none}

@media (max-width:820px){
  .dir-layout{grid-template-columns:minmax(0,1fr);gap:18px}
  .side{border-top:0;padding-top:0;flex-direction:row;flex-wrap:wrap;gap:12px}
  .side>div{flex:1 1 100%}
  .field-list{flex-direction:row;flex-wrap:wrap;gap:4px 14px}
  .ftab{border:0;padding:2px 0;font-size:15px;gap:5px}
  .side-f{flex:1 1 140px}
  .list-head{display:none}
  .card{grid-template-columns:minmax(0,1fr);gap:1px;padding:12px 4px}
  .c-field,.c-year{font-size:14px;color:var(--muted)}
  .c-field small,.c-year small{display:inline;margin-left:4px}
  .c-field small::before,.c-year small::before{content:"· "}
  .msgs{grid-template-columns:minmax(0,1fr)}
  .msgs.open .tlist{display:none}
  .msgs:not(.open) .convo{display:none}
  .tlist{border-right:0}
  .back{display:inline-flex}
}
@media (max-width:520px){.row2{grid-template-columns:1fr}.i-facts,.facts-list{grid-template-columns:minmax(0,1fr);gap:0}.i-facts dd,.facts-list dd{margin-bottom:6px}}
</style>
</head>
<body>

<header class="band">
  <div class="wrap">
    <div>
      <h1 id="schoolName">Our High School</h1>
      <p class="tagline">Alumni Career Network<button class="school-edit" id="editSchool" hidden>Rename school</button></p>
    </div>
    <div class="acct" id="acct"></div>
  </div>
</header>

<nav class="views" aria-label="Sections"><div class="wrap">
  <button class="vtab" type="button" data-view="directory" aria-current="page">Directory</button>
  <button class="vtab" type="button" data-view="internships" aria-current="false">Internships</button>
  <button class="vtab" type="button" data-view="messages" aria-current="false">Messages<span class="badge" id="unread" hidden></span></button>
</div></nav>

<main class="wrap" id="viewDir">
  <p class="intro">Look up graduates by the work they do now, then get in touch for advice, a job shadow or an informational interview.
    <span class="counts"><span id="sAlumni">0</span> graduates in <span id="sFields">0</span> fields. <span id="sMentors">0</span> have offered to mentor students.</span></p>
  <div class="dir-layout">
    <aside class="side" id="fieldsNav" aria-label="Filter the directory">
      <div><h2 class="side-h">Field</h2><div class="field-list" id="fieldTabs"></div></div>
      <label class="side-f">Willing to help with<select id="openFilter"><option value="">Anything</option></select></label>
      <label class="side-f">Graduated<select id="decadeFilter"><option value="">Any year</option></select></label>
    </aside>
    <div class="dir-main">
      <section class="news" aria-labelledby="news-h">
        <div class="news-head"><h2 id="news-h">Open internships</h2>
          <span class="news-links"><button class="linkbtn" type="button" id="newsPost" data-act="postint" hidden>Post an internship</button><button class="linkbtn" type="button" id="newsAll" data-view="internships">All internships</button></span></div>
        <div id="newsList"><p class="muted" style="margin:0">Loading internships…</p></div>
      </section>
      <div class="toolbar">
        <label class="search"><span hidden>Search</span>
          <input id="q" type="search" placeholder="Search by name, job, employer, college or city" aria-label="Search alumni">
        </label>
        <label class="small muted" for="sort">Sort by</label>
        <select id="sort">
          <option value="recent">Most recent graduates</option>
          <option value="oldest">Earliest graduates</option>
          <option value="name">Name</option>
          <option value="title">Job title</option>
          <option value="senior">Seniority, highest first</option>
          <option value="junior">Seniority, lowest first</option>
        </select>
        <button class="btn" id="addBtn" type="button">Add a graduate</button>
      </div>
      <div id="notice" class="notice" hidden></div>
      <div class="result-line" id="resultLine"></div>
      <div class="list-head" aria-hidden="true"><span>Name</span><span>Current position</span><span>Field</span><span>Class of</span></div>
      <section class="grid" id="grid" aria-live="polite"></section>
      <nav class="pager" id="pager" aria-label="Pages"></nav>
    </div>
  </div>
</main>
<main class="wrap" id="viewInt" hidden><div id="intRoot"></div><div style="height:48px"></div></main>
<main class="wrap" id="viewMsg" hidden><div id="msgRoot"></div></main>

<div class="scrim" id="scrim" hidden><aside class="sheet" id="sheet" role="dialog" aria-modal="true"></aside></div>
<div class="toast" id="toast" hidden></div>

<script>
const FIELDS=["Healthcare & Medicine","Engineering","Business","Finance","Law","Journalism","Media & Communications","Architecture","Performing Arts","Hospitality","Politics & Government","Technology & Computing","Education","Science & Research","Arts & Design","Military","Skilled Trades","Nonprofit & Social Impact","Sports & Recreation","Other"];
const OPEN=["Mentoring","Informational interviews","Job shadowing","Internships","Résumé review","College advice"];
const state={alumni:[],field:"",q:"",open:"",decade:"",sort:"recent",canWrite:null,canAdmin:false,db:null,uid:null,loaded:false};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const yr=y=>y?`Class of '${String(y).slice(-2)}`:"";

OPEN.forEach(o=>$("openFilter").insertAdjacentHTML("beforeend",`<option value="${esc(o)}">${esc(o)}</option>`));

function toast(msg){const t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2600)}
function notice(msg){const n=$("notice");n.textContent=msg||"";n.hidden=!msg}

/* Seniority from job title keywords, highest match wins. Works for profiles people add later too. */
const LEVELS=["","Student","Early career","Professional","Senior specialist","Manager","Executive / owner"];
const RANKS=[
  [1,/\b(student|trainee|apprentice)\b/i],
  [6,/\b(chief|ceo|cfo|cto|coo|president|vice president|vp|owner|founder|partner|executive director|artistic director|publisher|mayor|senator|state representative|judge)\b/i],
  [5,/\b(manager|director|administrator|head of|supervisor|principal|managing editor|executive chef|executive producer)\b/i],
  [4,/\b(senior|sr\.?|lead|physician|surgeon|cardiologist|dentist|cpa|actuary|professional engineer|attorney|architect|counsel|correspondent|anchor|producer)\b/i],
  [2,/\b(resident|intern|associate|junior|jr\.?|assistant|co-op|investment banking analyst|staff accountant|paralegal|aide|fellow|clerk)\b/i]];
function seniority(t){t=t||"";if(/physician assistant/i.test(t))return 4;for(const [n,re] of RANKS)if(re.test(t))return n;return t?3:0}
/* Precompute search text and seniority once per profile, so filtering 5,000 stays instant. */
function prep(a){a._hay=[a.name,a.title,a.organization,a.college,a.city,a.field,a.specialty].join(" ").toLowerCase();a._sen=seniority(a.title);return a}

function filtered(){
  const q=state.q.toLowerCase().trim();
  let list=state.alumni.filter(a=>{
    if(state.field&&a.field!==state.field)return false;
    if(state.open&&!(a.openTo||[]).includes(state.open))return false;
    if(state.decade&&String(Math.floor((+a.classYear||0)/10)*10)!==state.decade)return false;
    if(q&&!q.split(/\s+/).every(w=>a._hay.includes(w)))return false;
    return true});
  const s=state.sort;
  const byYear=(a,b)=>(a.classYear||0)-(b.classYear||0);
  list.sort((a,b)=>s==="name"?(a.name||"").localeCompare(b.name||"")
    :s==="title"?(a.title||"~").localeCompare(b.title||"~")||(a.name||"").localeCompare(b.name||"")
    :s==="senior"?b._sen-a._sen||byYear(a,b)
    :s==="junior"?a._sen-b._sen||byYear(b,a)
    :s==="oldest"?byYear(a,b):byYear(b,a));
  return list;
}

async function save(id){
  const v=k=>$(k).value.trim();
  const rec={name:v("f_name"),classYear:parseInt(v("f_year"))||null,field:v("f_field"),specialty:v("f_spec"),title:v("f_title"),organization:v("f_org"),city:v("f_city"),college:v("f_college"),
    openTo:OPEN.filter((o,i)=>$("f_open"+i).checked),email:v("f_email"),phone:v("f_phone"),linkedin:v("f_li"),preferred:v("f_pref"),bio:v("f_bio"),consent:$("f_consent").checked,updatedAt:new Date().toISOString()};
  const err=$("ferr");
  if(!rec.name||!rec.classYear||!rec.field){err.textContent="Add a name, graduation year, and field before saving.";return}
  if((rec.email||rec.phone||rec.linkedin)&&!rec.consent){err.textContent="Tick the consent box to confirm this graduate agreed to share their contact details, or remove the contact details.";return}
  if(!state.db){err.textContent="Saving isn't available in this view. This preview can't save changes.";return}
  $("fsave").disabled=true;err.textContent="";
  try{
    if(id){const old=state.alumni.find(x=>x.id===id)||{};await state.db.doc("alumni/"+id).set({...stripId(old),...rec})}
    else await state.db.collection("alumni").doc().set({...rec,createdAt:rec.updatedAt,addedBy:state.uid||null});
    closeSheet();toast(id?"Profile saved":`${rec.name} added to the directory`);
  }catch(e){
    $("fsave").disabled=false;
    if(e?.code==="invalid_argument"){state.canWrite=false;err.textContent="Your access level can view the directory but not change it. Ask the directory owner for Contributor access.";render()}
    else if(e?.code==="quota_exceeded")err.textContent="The directory is full. Remove outdated profiles to make room.";
    else err.textContent="Couldn't save right now. Check your connection and try again.";
  }
}
const stripId=o=>{const {id,...r}=o;return r};

async function del(id){
  try{await state.db.doc("alumni/"+id).delete();closeSheet();toast("Profile removed")}
  catch(e){$("delZone").innerHTML=`<p class="err">Couldn't remove this profile. ${e?.code==="invalid_argument"?"Your access level can't change the directory.":"Try again."}</p>`}
}

      if(m.alumniId&&m.alumniId!==alumniId){const old=state.alumni.find(x=>x.id===m.alumniId);if(old?.claimedBy===state.uid)await state.db.doc("alumni/"+m.alumniId).update({claimedBy:null})}
      const now=new Date().toISOString();

function subscribeThreads(){
  if(!state.member||!state.db)return;
  const db=state.db;
  const put=(kind,s)=>{state[kind]=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));state.threads={...state.mineT,...state.alumT};updateBadge();if(state.view==="messages")renderMsgs()};
  if(!state.mineSub)state.mineSub=db.collection("threads").where("starterId","==",state.uid).limit(500).onSnapshot(s=>put("mineT",s),()=>{});
  const aid=state.member.alumniId||null;
  if(aid!==state.subscribedAlum){
    state.unsubAlumThreads?.();state.subscribedAlum=aid;state.alumT={};state.threads={...state.mineT};
    state.unsubAlumThreads=aid?db.collection("threads").where("alumniId","==",aid).limit(500).onSnapshot(s=>put("alumT",s),()=>{}):null;
  }
}
function subscribeAll(){
  if(state.unsubAll)return;
  state.unsubAll=state.db.collection("threads").orderBy("lastAt","desc").limit(300).onSnapshot(s=>{state.allThreads=Object.fromEntries(s.docs.map(d=>[d.id,{id:d.id,...d.data()}]));if(state.view==="messages")renderMsgs()},()=>{});
}

let readBusy=false;
async function markRead(tid){
  const at=threadById(tid)?.lastAt;
  if(!at||state.reads[tid]>=at||readBusy||!state.db)return;
  state.reads={...state.reads,[tid]:at};updateBadge();
  readBusy=true;try{await state.db.doc(`data/users/${state.uid}/reads`).set(state.reads)}catch{}readBusy=false;
}

function openThread(tid,meta){
  if(state.active?.id!==tid){
    state.unsubMsgs?.();state.msgs=[];state.draft="";
    state.active={id:tid,...(threadById(tid)||meta||{})};
    state.unsubMsgs=state.db.collection(`threads/${tid}/messages`).orderBy("at").limit(500).onSnapshot(s=>{state.msgs=s.docs.map(d=>({id:d.id,...d.data()}));if(state.view==="messages")renderMsgs(true)},()=>{state.msgs=[];renderMsgs()});
  }
  markRead(tid);renderMsgs(true);
}
function startMessage(alumId){
  if(!state.uid){closeSheet();toast("Messaging is turned off in this preview.");return}
  if(!state.member){showJoin();return}
  if(state.member.alumniId===alumId){toast("That's your own profile.");return}
  closeSheet();state.staffMode=false;setView("messages");
  openThread(tidFor(state.uid,alumId),{starterId:state.uid,alumniId:alumId});
  $("m_text")?.focus();
}
async function sendMsg(text,via){
  const a=state.active;text=(text||"").trim();if(!a||!text)return false;
  const now=new Date().toISOString();const t=threadById(a.id);
  try{
    await state.db.collection(`threads/${a.id}/messages`).doc().set({from:state.uid,text,at:now,via});
    await state.db.doc("threads/"+a.id).set({starterId:a.starterId,alumniId:a.alumniId,createdAt:t?.createdAt||now,lastAt:now,lastFrom:state.uid,lastText:text.slice(0,140),lastVia:via});
    state.reads={...state.reads,[a.id]:now};
    state.db.doc(`data/users/${state.uid}/reads`).set(state.reads).catch(()=>{});
    return true;
  }catch(e){toast(e?.code==="invalid_argument"?"Your access level can't send messages. Ask the directory owner for Contributor access.":"Message not sent. Check your connection and try again.");return false}
}

      ||`<p class="sysnote">${alum&&!alum.claimedBy?`${esc(alum.name)} hasn't joined the network yet. Your message will wait here until they link their profile. You can also email them.`:"No messages yet. Introduce yourself and ask one specific question."}</p>`;

      ${alum&&act.starterId===state.uid?`<div class="actions">${alum.email?`<button class="btn ghost small" type="button" data-act="email" data-id="${esc(alum.id)}">Email instead</button>`:""}<button class="btn ghost small" type="button" data-act="viewprof" data-id="${esc(alum.id)}">Profile</button></div>`:""}</div>
      <div class="cbody" id="cbody">${bubbles}</div>
      ${participant?`<form class="composer" id="mform"><label for="m_text" hidden>Message</label><textarea id="m_text" rows="2" maxlength="4000" placeholder="Write a message… (Ctrl+Enter to send)"></textarea><button class="btn" type="submit">Send</button></form>`:`<p class="privacy">Staff review: you can read this conversation but not reply in it.</p>`}`;
  }
  root.innerHTML=`<div class="msg-top"><p class="privacy">Messages are kept in this directory's shared storage. This page shows each conversation only to the two people in it and to staff reviewers. Anyone with edit access to the directory can read all messages, so don't share passwords or private personal details.</p>${state.canAdmin?`<label class="staff-toggle"><input type="checkbox" id="m_staff" ${state.staffMode?"checked":""}> Review all conversations (staff)</label>`:""}</div>

function showEmail(alumId){
  const a=state.alumni.find(x=>x.id===alumId);if(!a)return;
  const first=(a.name||"").split(" ")[0];
  const me=state.myName||"[your name]";

document.addEventListener("click",e=>{

    <div class="row2"><label class="f">Location <small>City, or Remote</small><input id="i_loc" maxlength="120" value="${esc(i.location)}"></label>
      <label class="f">Field<select id="i_field"><option value="">Choose a field</option>${FIELDS.map(x=>`<option ${i.field===x?"selected":""}>${esc(x)}</option>`).join("")}</select></label></div>
    <fieldset><legend>Who can apply</legend><div class="checks">${GRADE_LEVELS.map((g,k)=>`<label><input type="checkbox" id="i_g${k}" ${(i.gradeLevels||[]).includes(g)?"checked":""}> ${esc(g)}</label>`).join("")}</div></fieldset>
    <div class="row2"><label class="f">Minimum GPA <small>Optional</small><input id="i_gpa" type="number" step="0.1" min="0" max="5" value="${esc(i.minGpa??"")}"></label><div></div></div>
    <label class="f">Experience or skills required <small>Optional, e.g. "Took AP Biology"</small><textarea id="i_exp" rows="2" maxlength="600">${esc(i.experience)}</textarea></label>
    ${item?`<label class="checks-inline"><input type="checkbox" id="i_open" ${i.isOpen?"checked":""}> Still accepting applications</label>`:""}
    <div class="err" id="ierr" role="alert"></div>
    <div class="actions"><button class="btn" type="submit" id="isave">${item?"Save changes":"Post internship"}</button>${item?`<button class="btn danger" type="button" id="idel">Delete posting</button>`:""}</div>
    <div id="idelZone"></div>
  </form>`);
  const syncPay=()=>{$("i_payL").hidden=!$("i_paid_yes").checked};
  document.querySelectorAll('input[name="i_paid"]').forEach(r=>r.addEventListener("change",syncPay));syncPay();
  const owner=item?.owner||state.uid;
  const fail=err=>{$("isave").disabled=false;$("ierr").textContent=err?.code==="invalid_argument"?"Your access level can't post here. Ask the directory owner for Contributor access.":"Couldn't save. Check your connection and try again."};
  $("iform").addEventListener("submit",async e=>{e.preventDefault();
    const v=id=>$(id).value.trim();const paid=document.querySelector('input[name="i_paid"]:checked')?.value;
    const rec={company:v("i_company"),roleTitle:v("i_title"),description:v("i_desc"),signupUrl:v("i_url"),spots:parseInt(v("i_spots"))||null,
      gradeLevels:GRADE_LEVELS.filter((g,k)=>$("i_g"+k).checked),minGpa:v("i_gpa")===""?null:Number(v("i_gpa")),experience:v("i_exp"),
      paid:paid==="yes",payDetails:paid==="yes"?v("i_pay"):"",location:v("i_loc"),field:v("i_field"),deadline:v("i_deadline"),isOpen:item?$("i_open").checked:true};
    const err=$("ierr");
    if(!rec.company||!rec.roleTitle||!rec.description){err.textContent="Add the company, the internship title and a short description.";return}
    if(!/^https?:\/\/\S+$/i.test(rec.signupUrl)){err.textContent="Add the sign-up link, starting with https://";return}
    if(!paid){err.textContent="Say whether the internship is paid or unpaid.";return}
    if(rec.spots!==null&&(rec.spots<1||rec.spots>1000)){err.textContent="Spots must be between 1 and 1,000.";return}
    if(rec.minGpa!==null&&(isNaN(rec.minGpa)||rec.minGpa<0||rec.minGpa>5)){err.textContent="Minimum GPA must be between 0 and 5.";return}
    $("isave").disabled=true;err.textContent="";const now=new Date().toISOString();
    try{
      await writePosts(owner,posts=>item?posts.map(p=>p.id===item.id?{...p,...rec,updatedAt:now}:p)
        :[{id:"i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),...rec,createdAt:now,updatedAt:now},...posts]);
      closeSheet();toast(item?"Internship updated":"Internship posted");
    }catch(x){fail(x)}
  });
  $("idel")?.addEventListener("click",()=>{
    $("idelZone").innerHTML=`<div class="notice">Delete this posting for everyone? <div class="actions" style="margin-top:8px"><button class="btn danger small" type="button" id="idelYes">Yes, delete</button><button class="btn ghost small" type="button" id="idelNo">Keep it</button></div></div>`;
    $("idelNo").onclick=()=>$("idelZone").innerHTML="";
    $("idelYes").onclick=async()=>{try{await writePosts(owner,posts=>posts.filter(p=>p.id!==item.id));closeSheet();toast("Posting deleted")}catch(x){fail(x)}};
  });
}

/* ---------- data ---------- */
function mergeAlumni(){state.alumni=[...state.real,...state.samples];render();renderAllInt();if(state.view==="messages")renderMsgs()}
fetch("sample-alumni.json").then(r=>r.ok?r.json():[]).then(list=>{state.samples=list.map(a=>prep({...a,sample:true,static:true,consent:true}));state.loaded=true;mergeAlumni()}).catch(()=>{});
fetch("sample-internships.json").then(r=>r.ok?r.json():[]).then(list=>{state.intSamples=list;renderAllInt()}).catch(()=>{});
state.school="Our High School";
setView(VIEWS.includes(location.hash.slice(1))?location.hash.slice(1):"directory");
render();renderNews();
(async()=>{
  const timer=setTimeout(()=>{if(!state.loaded){state.loaded=true;notice("The directory can't be reached yet. It will fill in once the connection returns.");render()}},10000);
  const use=n=>window.claude?.use?Promise.resolve(window.claude.use(n)).catch(()=>null):Promise.resolve(null);
  const [db,user]=await Promise.all([use("db"),use("user")]);
  state.user=user;
  if(user){
    state.canAdmin=await user.canEdit().catch(()=>false);
    const w=await user.can("data.write").catch(()=>null);state.canWrite=w;
    state.uid=await user.id().catch(()=>null);
    try{state.myName=(await user.me())?.name||""}catch{}
  }
  if(!db){clearTimeout(timer);state.loaded=true;state.ready=true;state.uid=null;state.canWrite=false;notice("Preview version: you can browse the directory and internships. Signing in, messaging and posting work once the full site is hosted.");render();renderAcct();renderAllInt();if(state.view==="messages")renderMsgs();return}
  state.db=db;state.ready=true;
  if(state.uid){
    db.doc("members/"+state.uid).onSnapshot(s=>{state.member=s.exists?s.data():null;renderAcct();subscribeThreads();renderAllInt();if(state.view==="messages")renderMsgs()},()=>{});
    db.collection("members").limit(1000).onSnapshot(s=>{state.members=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));renderAllInt();if(state.view==="messages")renderMsgs()},()=>{});
    db.doc(`data/users/${state.uid}/reads`).onSnapshot(s=>{if(s.exists){const r={...state.reads};for(const [k,v] of Object.entries(s.data()||{}))if(!(r[k]>=v))r[k]=v;state.reads=r}updateBadge()},()=>{});
  }
  renderAcct();if(state.view==="messages")renderMsgs();
  db.doc("config/school").onSnapshot(s=>{const n=s.exists&&s.data()?.name;if(n){state.school=n;$("schoolName").textContent=n;document.title=n+" Alumni Network"}},()=>{});
  db.collection("internships").onSnapshot(s=>{state.intDocs=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));renderAllInt()},()=>{});
  db.collection("alumni").onSnapshot(snap=>{
    state.real=snap.docs.map(d=>prep({id:d.id,...d.data()}));
    if(!snap.metadata.fromCache){clearTimeout(timer);notice("")}
    state.loaded=true;mergeAlumni();
  },err=>{clearTimeout(timer);state.loaded=true;notice("The directory couldn't load. Reload the page to try again.");render()});
})();
</script>
